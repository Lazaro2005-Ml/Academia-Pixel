
name: Academia Pixel - APK prueba

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Preparar Android
        working-directory: android-app
        env:
          ACADEMIA_SERVER_URL: https://proud-kindness-production-0af12a18.up.railway.app
        run: |
          npm install --no-audit --no-fund
          npm run android:init

      - name: Generar APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AcademiaPixel-Android-APK-Prueba
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
