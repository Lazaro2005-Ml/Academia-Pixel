services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    environment:
      ACADEMIA_DATA_DIR: /data
      COOKIE_SECURE: "1"
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
    volumes:
      - academia_data:/data
    expose:
      - "8000"
    # IMPORTANTE: una sola instancia/worker; las salas online se guardan en memoria.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    environment:
      ACADEMIA_DOMAIN: ${ACADEMIA_DOMAIN:?Configura ACADEMIA_DOMAIN en deployment/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  academia_data:
  caddy_data:
  caddy_config:
